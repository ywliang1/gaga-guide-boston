# Supabase pauses free projects after 7 days without activity, which would hide
# the votes and comments on the site. This reads the vote and comment counts
# every 3 days so the project always counts as active.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read vote and comment counts
        env:
          URL: https://trivivzoyzsqilansltz.supabase.co/rest/v1/rpc
          KEY: sb_publishable_XSoGxLnG-EdaRDFRsdk3KQ_8or0ViUV
        run: |
          for fn in vote_totals comment_counts; do
            curl --fail --silent --show-error --retry 3 -X POST "$URL/$fn" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -o /dev/null
            echo "$fn ok"
          done
      # GitHub turns off scheduled jobs in repos with no commits for 60 days;
      # re-enabling this workflow each run resets that clock.
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-supabase-awake.yml --repo "${{ github.repository }}"
